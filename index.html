<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Word Learning - Mobile</title>
  <style>
    :root {
      --bg: #0b1220; --card: #151f32; --text: #e2e8f0; --muted: #94a3b8;
      --primary: #3b82f6; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --purple: #a855f7;
      --border: #1e293b; --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 1rem; }
    header { width: 100%; max-width: 560px; margin-bottom: 1rem; }
    h1 { font-size: 1.2rem; color: var(--muted); margin-bottom: 0.5rem; text-align: center; }
    
    .list-selector { display: flex; gap: 0.3rem; align-items: center; justify-content: center; margin-bottom: 0.8rem; flex-wrap: wrap; }
    .list-selector select { padding: 0.4rem; background: var(--card); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.85rem; min-width: 120px; }
    .list-selector .btn { padding: 0.4rem 0.6rem; font-size: 0.8rem; }
    
    .nav-row { display: flex; gap: 0.3rem; background: var(--card); padding: 3px; border-radius: 8px; border: 1px solid var(--border); flex-wrap: wrap; }
    .nav-btn { flex: 1; min-width: 50px; padding: 0.4rem; border: none; background: transparent; color: var(--muted); font-weight: 500; cursor: pointer; border-radius: 6px; transition: 0.2s; font-size: 0.8rem; }
    .nav-btn.active { background: var(--primary); color: #fff; }
    .nav-btn:hover { background: var(--border); }
    .nav-btn.active:hover { background: var(--primary); }
    .nav-btn.log-btn { color: var(--warning); }
    .nav-btn.log-btn.active { background: var(--warning); color: #000; }

    .card-wrap { width: 100%; max-width: 500px; margin-bottom: 1rem; position: relative; }
    .flashcard { 
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); 
      padding: 2rem 1.5rem; text-align: center; cursor: pointer; user-select: text;
      position: relative; overflow: hidden; touch-action: manipulation;
    }
    .flashcard:active { transform: scale(0.98); }
    .flashcard .word { 
      font-size: 2rem; font-weight: 400; margin-bottom: 0.2rem; min-height: 2.5rem; line-height: 1.2; user-select: text;
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .flashcard .pron { font-size: 1rem; color: var(--primary); font-weight: 500; margin-bottom: 0.6rem; min-height: 1.3rem; font-family: ui-monospace, monospace; }
    .flashcard .trans { font-size: 1.2rem; color: var(--muted); font-weight: 400; opacity: 0; transform: translateY(6px); transition: opacity 0.3s ease, transform 0.3s ease; min-height: 1.8rem; user-select: text; }
    .flashcard .trans.visible { opacity: 1; transform: translateY(0); }
    .flashcard .badge { position: absolute; top: 0.6rem; right: 0.6rem; font-size: 0.7rem; background: var(--bg); color: var(--muted); padding: 0.2rem 0.5rem; border-radius: 4px; border: 1px solid var(--border); }
    .flashcard .hint { font-size: 0.75rem; color: var(--muted); opacity: 0.7; margin-top: 0.6rem; }
    .flashcard .meta-row { font-size: 0.7rem; color: var(--muted); margin-top: 0.2rem; display: flex; justify-content: center; gap: 0.8rem; flex-wrap: wrap; }

    .controls { display: flex; gap: 0.3rem; justify-content: center; margin-bottom: 0.8rem; }
    .btn { padding: 0.4rem 0.8rem; border: none; border-radius: 6px; font-weight: 500; cursor: pointer; transition: 0.15s; background: var(--primary); color: #fff; user-select: none; font-size: 0.85rem; }
    .btn:active { opacity: 0.9; }
    .btn.secondary { background: var(--card); border: 1px solid var(--border); color: var(--text); }
    .btn.danger { background: var(--danger); }
    .btn.success { background: var(--success); }
    
    .status-msg { text-align: center; min-height: 1.2rem; color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem; }

    .filter-row { display: flex; gap: 0.3rem; margin-bottom: 0.6rem; flex-wrap: wrap; }
    .filter-btn { padding: 0.3rem 0.6rem; font-size: 0.8rem; background: var(--card); border: 1px solid var(--border); color: var(--muted); border-radius: 4px; cursor: pointer; }
    .filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    
    .list-view { width: 100%; max-width: 560px; display: none; }
    .list-view.active { display: block; }
    .word-list { display: grid; gap: 0.4rem; max-height: 50vh; overflow-y: auto; padding-right: 0.3rem; }
    .word-item { display: flex; align-items: flex-start; gap: 0.6rem; background: var(--card); padding: 0.6rem; border-radius: 8px; border: 1px solid var(--border); }
    .word-item .info { flex: 1; min-width: 0; }
    .word-item .w { font-weight: 500; font-size: 0.95rem; word-break: break-word; }
    .word-item .p { font-size: 0.8rem; color: var(--primary); font-family: ui-monospace, monospace; margin: 0.05rem 0; }
    .word-item .t { color: var(--muted); font-size: 0.8rem; margin-top: 0.05rem; white-space: normal; word-break: break-word; line-height: 1.2; }
    .word-item .meta { font-size: 0.7rem; color: var(--muted); margin-top: 0.15rem; }
    .word-item .status-tag { font-size: 0.65rem; padding: 0.15rem 0.4rem; border-radius: 3px; font-weight: 600; }
    .status-tag.new { background: rgba(59,130,246,0.2); color: var(--primary); }
    .status-tag.postponed { background: rgba(168,85,247,0.2); color: var(--purple); }
    .status-tag.revision { background: rgba(16,185,129,0.2); color: var(--success); }
    .word-item .actions { display: flex; gap: 0.3rem; flex-shrink: 0; align-self: center; }
    .word-item .actions button { padding: 0.25rem 0.5rem; font-size: 0.8rem; }

    .log-container { 
      background: #0a0f18; border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem; 
      height: 55vh; overflow-y: auto; font-family: ui-monospace, monospace; font-size: 0.75rem; 
      white-space: pre-wrap; word-break: break-all; line-height: 1.4;
    }
    .log-entry { margin-bottom: 0.25rem; border-bottom: 1px solid #1e293b; padding-bottom: 0.2rem; }
    .log-entry.error { color: #ef4444; }
    .log-entry.warn { color: #f59e0b; }
    .log-entry.info { color: #3b82f6; }
    .log-entry.log { color: #94a3b8; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.2rem; width: 100%; max-width: 400px; max-height: 85vh; overflow-y: auto; }
    .modal h3 { margin-bottom: 0.8rem; font-size: 1.1rem; }
    .modal input, .modal select, .modal textarea { width: 100%; padding: 0.5rem; margin-bottom: 0.6rem; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.9rem; }
    .modal textarea { min-height: 70px; resize: vertical; font-family: monospace; }
    .modal label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.2rem; }
    .modal-actions { display: flex; gap: 0.4rem; justify-content: flex-end; margin-top: 0.4rem; }

    .settings-content { display: grid; gap: 0.8rem; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; }
    .row input { width: 50px; padding: 0.3rem; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--text); text-align: center; font-size: 0.9rem; }
    .data-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.4rem; }
    .data-actions .btn { flex: 1; min-width: 90px; justify-content: center; font-size: 0.8rem; }
    
    .quick-import textarea { width: 100%; min-height: 70px; padding: 0.5rem; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: monospace; font-size: 0.85rem; margin-bottom: 0.4rem; }
    .quick-import small { display: block; color: var(--muted); margin-bottom: 0.4rem; font-size: 0.8rem; }
    .quick-import .warn { color: var(--warning); font-size: 0.75rem; display: block; margin-top: 0.2rem; }

    .add-section { width: 100%; max-width: 500px; padding: 1rem; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); margin-top: 0.8rem; }
    .add-section h3 { margin-bottom: 0.6rem; font-size: 0.95rem; color: var(--muted); }
    .input-group { display: flex; gap: 0.4rem; margin-bottom: 0.6rem; flex-wrap: wrap; }
    .input-group input { flex: 1; min-width: 100px; padding: 0.5rem; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.9rem; }

    @media (max-width: 480px) { 
      .flashcard .word { font-size: 1.7rem; } 
      .flashcard { padding: 1.8rem 1.2rem; }
      .input-group { flex-direction: column; }
      .input-group input { width: 100%; }
      .nav-btn { min-width: 45px; padding: 0.35rem; font-size: 0.75rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>📖 Word Learning</h1>
    <div class="list-selector">
      <select id="list-select" onchange="window.switchList(this.value)"></select>
      <button class="btn secondary" onclick="window.createNewList()">+ New</button>
      <button class="btn danger" onclick="window.deleteCurrentList()">🗑</button>
    </div>
    <div class="nav-row">
      <button class="nav-btn active" data-mode="learning">📖 Learn</button>
      <button class="nav-btn" data-mode="repeating">🔄 Repeat</button>
      <button class="nav-btn list-btn" onclick="window.toggleList()">📋 List</button>
      <button class="nav-btn log-btn" onclick="window.showLogView()">📜 Log</button>
      <button class="nav-btn settings-btn" onclick="window.toggleSettings()">⚙️</button>
    </div>
  </header>

  <main>
    <section id="card-view" class="view-section">
      <div class="card-wrap">
        <div class="flashcard" id="main-card">
          <div class="badge" id="q-badge">0/0</div>
          <div class="word" id="c-word">---</div>
          <div class="pron" id="c-pron"></div>
          <div class="trans" id="c-trans">---</div>
          <div class="meta-row">
            <span id="c-counter">Seen: 0×</span>
            <span id="c-revision">Last: Never</span>
          </div>
          <div class="hint">Tap to move · Select text freely</div>
        </div>
      </div>
      <div class="controls">
        <button class="btn secondary" onclick="window.prevCard()">⏮</button>
        <button class="btn secondary" id="pause-btn" onclick="window.togglePause()">⏸</button>
        <button class="btn secondary" onclick="window.nextCard()">⏭</button>
      </div>
      <div class="status-msg" id="status">Add words to begin</div>
    </section>

    <section id="list-view" class="view-section list-view">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.6rem;">
        <h3 style="color:var(--muted); font-size:1rem;">📚 Library</h3>
        <button class="btn secondary" onclick="window.toggleList()" style="padding:0.3rem 0.6rem; font-size:0.8rem;">Back</button>
      </div>
      <div class="filter-row">
        <button class="filter-btn active" data-filter="all" onclick="window.setFilter('all')">All</button>
        <button class="filter-btn" data-filter="new" onclick="window.setFilter('new')">📖 New</button>
        <button class="filter-btn" data-filter="postponed" onclick="window.setFilter('postponed')">📥 Postponed</button>
        <button class="filter-btn" data-filter="revision" onclick="window.setFilter('revision')">🔄 Revision</button>
      </div>
      <div class="word-list" id="word-list"></div>
      <div id="empty-list" style="text-align:center; padding:1.5rem; color:var(--muted); display:none; font-size:0.9rem;">No words yet.</div>
    </section>

    <section id="log-view" class="view-section list-view">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.6rem;">
        <h3 style="color:var(--muted); font-size:1rem;">📜 App Log</h3>
        <button class="btn secondary" onclick="window.showLogView()" style="padding:0.3rem 0.6rem; font-size:0.8rem;">Back</button>
      </div>
      <div id="log-container" class="log-container"></div>
      <button class="btn secondary" onclick="window.clearLog()" style="margin-top:0.5rem; width:100%;">🗑 Clear Log</button>
    </section>

    <section class="add-section">
      <h3>➕ Add Word</h3>
      <div class="input-group">
        <input type="text" id="input-word" placeholder="Word">
        <input type="text" id="input-pron" placeholder="Pronunciation">
        <input type="text" id="input-trans" placeholder="Translation">
      </div>
      <button class="btn success" onclick="window.addWord()" style="width:100%">Add</button>
    </section>
  </main>

  <!-- SETTINGS MODAL -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal">
      <h3>⚙️ Settings</h3>
      <div class="settings-content">
        <div class="row">
          <label>Word time</label>
          <input type="number" id="set-word-time" min="1" max="60" value="4"> <span>sec</span>
        </div>
        <div class="row">
          <label>Trans time</label>
          <input type="number" id="set-trans-time" min="1" max="60" value="4"> <span>sec</span>
        </div>
        <div class="row">
          <label>Batch size</label>
          <input type="number" id="set-batch-size" min="1" max="1000" value="100"> <span>words</span>
        </div>
        <button class="btn secondary" onclick="window.resetBatch()" style="margin-top:0.3rem; width:100%; font-size:0.85rem;">🔄 Reset Batch</button>
        <div class="quick-import">
          <strong>📥 Quick Import</strong>
          <small>Paste: word///translation</small>
          <span class="warn">⚠️ No JSON here.</span>
          <textarea id="quick-import-area" placeholder="apple///яблоко"></textarea>
          <div style="display:flex; gap:0.3rem;">
            <button class="btn success" onclick="window.quickImport()">Import</button>
            <button class="btn secondary" onclick="document.getElementById('quick-import-area').value=''">Clear</button>
          </div>
        </div>
        <hr style="border:none; border-top:1px solid var(--border); margin:0.2rem 0;">
        <div class="data-actions">
          <button class="btn secondary" onclick="window.exportData()">📤 Export</button>
          <input type="file" id="import-file" accept=".json" style="display:none" onchange="window.importJSON(this)">
          <button class="btn secondary" onclick="document.getElementById('import-file').click()">📥 Import</button>
          <button class="btn danger" onclick="window.clearAll()">🗑 Clear</button>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="window.applySettings()">Apply</button>
      </div>
    </div>
  </div>

  <!-- EDIT MODAL -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal">
      <h3>✏️ Edit</h3>
      <label>Word</label>
      <input type="text" id="edit-word">
      <label>Pronunciation</label>
      <input type="text" id="edit-pron">
      <label>Translation</label>
      <input type="text" id="edit-trans">
      <label>Status</label>
      <select id="edit-status">
        <option value="new">📖 New</option>
        <option value="postponed">📥 Postponed</option>
        <option value="revision">🔄 Revision</option>
      </select>
      <label>Counter</label>
      <input type="number" id="edit-counter" readonly style="background:var(--bg); opacity:0.7;">
      <label>Last seen</label>
      <input type="text" id="edit-revision" readonly style="background:var(--bg); opacity:0.7;">
      <div class="modal-actions">
        <button class="btn secondary" onclick="window.closeModal()">Cancel</button>
        <button class="btn" onclick="window.saveEdit()">Save</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      "use strict";
      // ================= STATE =================
      var STATUS_NEW = 'new', STATUS_POSTPONED = 'postponed', STATUS_REVISION = 'revision';
      var KEY_DATA = 'wApp_mobile_v1';
      var appData = { lists: {}, currentListId: null, nextListId: 1 };
      var words = [], settings = { wordTime: 4, transTime: 4, batchSize: 100 }, mode = 'learning', currentFilter = 'all';
      var currentBatchIds = [], queue = [], queueIndex = 0;
      var paused = false, phase = 'idle', phaseStart = 0, phaseDuration = 0, timerId = null, editingId = null;
      var sessionRecursionGuard = false;
      var storageAvailable = true;
      var logEntries = [];
      
      // DOM Elements
      var $, elCard, elWord, elPron, elTrans, elCounter, elRevision, elBadge, elStatus, elPauseBtn, logContainer;

      // ================= GLOBAL FUNCTIONS =================
      // Defined here to be available to HTML immediately
      window.toggleList = function() { 
        if (!$ || !logContainer) return;
        var lv = $('list-view'), is = !lv.classList.contains('active'); 
        lv.classList.toggle('active', is); 
        $('card-view').style.display = is ? 'none' : 'block'; 
        $('log-view').classList.remove('active'); 
        if (is) { paused = true; window.clearTimer(); window.updatePauseBtn(); window.renderWordList(); } 
        else window.startSession(); 
      };

      window.showLogView = function() { 
        if (!$ || !logContainer) return;
        var lv = $('log-view'), is = !lv.classList.contains('active'); 
        lv.classList.toggle('active', is); 
        $('card-view').style.display = 'none'; 
        $('list-view').classList.remove('active'); 
        if (is) { paused = true; window.clearTimer(); window.updatePauseBtn(); } 
        else window.startSession(); 
      };

      window.toggleSettings = function() { if ($) $('settings-modal').classList.toggle('active'); };
      window.closeModal = function() { if ($) $('edit-modal').classList.remove('active'); editingId = null; };
      window.setFilter = function(f) { if (f) { currentFilter = f; document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.toggle('active', b.dataset.filter === f); }); window.renderWordList(); } };
      window.clearLog = function() { if (!logContainer) return; logEntries = []; logContainer.innerHTML = ''; console.log('Log cleared'); };
      window.switchList = function(id) { 
        if (!appData || !appData.lists) return;
        console.log('Switching list to:', id); 
        if (appData.lists[id]) { 
          appData.currentListId = id; 
          window.saveData(); window.loadCurrentList(); window.syncBatchStatuses(); window.startSession(); 
          if ($('list-view').classList.contains('active')) window.renderWordList(); 
        } 
      };

      window.createNewList = function() { 
        var name = prompt('List name:', 'List ' + appData.nextListId); if (!name) return; 
        var id = String(appData.nextListId++); 
        appData.lists[id] = { id, name, words: [], settings: { wordTime: 4, transTime: 4, batchSize: 100 }, batch: [], nextWordId: 1 }; 
        appData.currentListId = id; window.saveData(); window.renderListSelector(); window.loadCurrentList(); window.syncBatchStatuses(); window.startSession(); 
        window.toast('✅ Created'); 
      };

      window.deleteCurrentList = function() { 
        var list = appData.lists[appData.currentListId]; if (!confirm('Delete "' + list.name + '"?')) return; 
        delete appData.lists[appData.currentListId]; 
        var rem = Object.keys(appData.lists); appData.currentListId = rem.length ? rem[0] : null; 
        if (!appData.currentListId) window.createDefaultList(); 
        window.saveData(); window.renderListSelector(); window.loadCurrentList(); window.syncBatchStatuses(); window.startSession(); 
        window.toast('🗑 Deleted'); 
      };

      window.applySettings = function() { 
        console.log('Applying settings'); 
        settings.wordTime = window.clamp(1, 60, parseInt($('set-word-time').value) || 4); 
        settings.transTime = window.clamp(1, 60, parseInt($('set-trans-time').value) || 4); 
        settings.batchSize = window.clamp(1, 1000, parseInt($('set-batch-size').value) || 100); 
        window.saveCurrentList(); window.syncBatchStatuses(); window.toggleSettings(); window.toast('✅ Applied'); window.startSession(); 
      };

      window.resetBatch = function() { 
        words.forEach(function(w) { if (w.status === STATUS_NEW) w.status = STATUS_POSTPONED; }); 
        currentBatchIds = []; window.saveCurrentList(); window.syncBatchStatuses(); window.toggleSettings(); window.toast('🔄 Reset'); window.startSession(); 
      };

      window.clearAll = function() { if (!confirm('Delete ALL?')) return; appData = { lists: {}, currentListId: null, nextListId: 1 }; window.saveData(); window.loadAll(); window.toast('🗑 Cleared'); };
      window.prevCard = function() { window.clearTimer(); queueIndex = Math.max(0, queueIndex - 1); window.showCurrentCard(); };
      window.nextCard = function() { window.clearTimer(); window.advance(); };
      
      // Fix for updatePauseBtn scope
      window.updatePauseBtn = function() { if (elPauseBtn) elPauseBtn.textContent = paused ? '▶' : '⏸'; };

      window.togglePause = function() { 
        paused = !paused; 
        window.updatePauseBtn(); 
        if (!paused && phase !== 'idle') { 
          var r = phaseDuration - (Date.now() - phaseStart); 
          var n = phase === 'word' ? window.showTranslation : window.advance; 
          if (r <= 10) n(); else window.startPhase(r, n); 
        } else { window.clearTimer(); } 
      };

      window.addWord = function() { 
        var w = $('input-word').value.trim(), p = $('input-pron').value.trim(), t = $('input-trans').value.trim(); 
        if (!w || !t) return window.toast('❌ Word & translation'); 
        var id = String(appData.lists[appData.currentListId].nextWordId++); 
        words.push({ id, word: w, pronunciation: p, translation: t, status: STATUS_POSTPONED, counter: 0, lastRevision: '' }); 
        window.saveCurrentList(); window.syncBatchStatuses(); window.startSession(); 
        window.toast('✅ Added'); 
      };
      
      window.quickImport = function() { 
        var raw = $('quick-import-area').value.trim(); 
        if (!raw) return window.toast('❌ Paste word///translation'); 
        var parts = raw.split('///').map(function(s) { return s.trim(); }).filter(Boolean); 
        if (parts.length % 2 !== 0) return window.toast('❌ Odd count'); 
        var added = 0, list = appData.lists[appData.currentListId]; 
        for (var i=0; i<parts.length; i+=2) { 
          if (parts[i] && parts[i+1] && !words.some(function(x) { return x.word.toLowerCase() === parts[i].toLowerCase(); })) { 
            words.push({ id: String(list.nextWordId++), word: parts[i], pronunciation: '', translation: parts[i+1], status: STATUS_POSTPONED, counter: 0, lastRevision: '' }); 
            added++; 
          } 
        } 
        if (added) { window.saveCurrentList(); window.syncBatchStatuses(); window.startSession(); window.toast('✅ Imported ' + added); } 
        else window.toast('⚠️ None'); 
      };
      
      window.importJSON = function(inp) { 
        var f = inp.files[0]; if (!f) return; 
        var r = new FileReader(); 
        r.onload = function(e) { 
          try { 
            var d = JSON.parse(e.target.result); 
            if (!Array.isArray(d) && d.words) d = d.words; 
            if (!Array.isArray(d)) throw 1; 
            var c=0, list = appData.lists[appData.currentListId]; 
            var isNative = d.length > 0 && typeof d[0].word === 'string'; 
            d.forEach(function(it) { 
              var w, t, p, st, counter, lastRev;
              if (isNative) {
                w = String(it.word || '').trim(); t = String(it.translation || '').trim(); p = it.pronunciation || ''; st = (it.status === STATUS_REVISION) ? STATUS_REVISION : STATUS_POSTPONED; counter = it.counter || 0; lastRev = it.lastRevision || '';
              } else {
                if (!it.word || !Array.isArray(it.word)) return;
                w = String(it.word[0]||'').trim(); t = String(it.word[1]||'').trim(); p = String(it.word[2]||'').trim(); st = (String(it.direction).trim()==='1') ? STATUS_REVISION : STATUS_POSTPONED; counter = parseInt(it.counter)||0; lastRev = it.lastRevision||'';
              }
              if (!w || !t || words.some(function(x){return x.word.toLowerCase()===w.toLowerCase();})) return; 
              words.push({id:String(list.nextWordId++), word:w, pronunciation:p, translation:t, status:st, counter:counter, lastRevision:lastRev}); 
              c++; 
            }); 
            if(c){ window.saveCurrentList(); window.syncBatchStatuses(); window.startSession(); if($('list-view').classList.contains('active')) window.renderWordList(); window.toast('✅ '+c); } 
            else window.toast('⚠️ None'); 
          } catch(x) { window.toast('❌ Invalid JSON'); } 
        }; 
        r.readAsText(f); inp.value=''; 
      };
      
      window.exportData = function() { 
        if (!storageAvailable) return window.toast('❌ Storage disabled'); 
        var list = appData.lists[appData.currentListId], a = document.createElement('a'); 
        a.href = URL.createObjectURL(new Blob([JSON.stringify(list.words, null, 2)], {type:'application/json'})); 
        a.download = list.name.replace(/\s+/g, '_') + '.json'; a.click(); window.toast('📤 Exported'); 
      };
      
      window.renderWordList = function() { 
        if (!words || !words.length) { $('empty-list').style.display = 'block'; return; }
        window.syncBatchStatuses(); var c = $('word-list'); c.innerHTML = ''; 
        var f = currentFilter === 'all' ? words : words.filter(function(w) { return w.status === currentFilter; }); 
        if (!f.length) { $('empty-list').style.display = 'block'; return; } $('empty-list').style.display = 'none'; 
        f.forEach(function(w) { var el = document.createElement('div'); el.className = 'word-item'; var ph = w.pronunciation ? '<div class="p">' + window.escHtml(w.pronunciation) + '</div>' : ''; var dt = w.lastRevision ? new Date(w.lastRevision).toLocaleDateString() : '-'; el.innerHTML = '<div class="info"><div class="w">' + window.escHtml(w.word) + '</div>' + ph + '<div class="t">' + window.escHtml(w.translation) + '</div><div class="meta">👁 ' + (w.counter || 0) + '</div></div><span class="status-tag ' + w.status + '">' + w.status + '</span><div class="actions"><button class="btn secondary" onclick="window.openEdit(\'' + w.id + '\')">✏️</button><button class="btn danger" onclick="window.deleteWord(\'' + w.id + '\')">🗑</button></div>'; c.appendChild(el); }); 
      };

      window.openEdit = function(id) { 
        editingId = id; var w = words.find(function(x) { return x.id === id; }); if (!w) return; 
        $('edit-word').value = w.word || ''; $('edit-pron').value = w.pronunciation || ''; $('edit-trans').value = w.translation || ''; 
        $('edit-status').value = w.status || STATUS_POSTPONED; $('edit-counter').value = w.counter || 0; 
        $('edit-revision').value = w.lastRevision ? new Date(w.lastRevision).toLocaleString() : 'Never'; $('edit-modal').classList.add('active'); 
      };
      
      window.saveEdit = function() { 
        var w = words.find(function(x) { return x.id === editingId; }); if (!w) return window.closeModal(); 
        w.word = $('edit-word').value.trim() || w.word; w.pronunciation = $('edit-pron').value.trim(); 
        w.translation = $('edit-trans').value.trim() || w.translation; var ns = $('edit-status').value; 
        if (ns !== w.status) { w.status = ns; } 
        window.saveCurrentList(); window.syncBatchStatuses(); window.closeModal(); window.renderWordList(); window.startSession(); 
        window.toast('✅ Saved'); 
      };
      
      window.deleteWord = function(id) { 
        if (!confirm('Delete?')) return; 
        words = words.filter(function(w) { return w.id !== id; }); 
        currentBatchIds = currentBatchIds.filter(function(b) { return b !== id; }); 
        window.saveCurrentList(); window.syncBatchStatuses(); window.renderWordList(); window.startSession(); 
        window.toast('🗑 Deleted'); 
      };

      // ================= LOGGING SYSTEM =================
      function setupLogging() {
        logContainer = $('log-container');
        function addLog(type, args) {
          var time = new Date().toLocaleTimeString();
          var msg = Array.prototype.map.call(args, function(a) {
            try { return (typeof a === 'object' && a !== null) ? JSON.stringify(a).substring(0, 150) : String(a); } catch(e) { return String(a); }
          }).join(' ');
          logEntries.push({ time, type, msg });
          if (logEntries.length > 600) logEntries.shift();
          if (logContainer) {
            var entry = document.createElement('div');
            entry.className = 'log-entry ' + (type === 'error' ? 'error' : type === 'warn' ? 'warn' : type === 'info' ? 'info' : 'log');
            entry.textContent = `[${time}] ${msg}`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
          }
        }
        var oLog = console.log, oErr = console.error, oWarn = console.warn;
        console.log = function() { addLog('log', arguments); oLog.apply(console, arguments); };
        console.error = function() { addLog('error', arguments); oErr.apply(console, arguments); };
        console.warn = function() { addLog('warn', arguments); oWarn.apply(console, arguments); };
        window.onerror = function(msg, url, line, col, err) { addLog('error', ['❌ Error: ' + msg + ' (L:' + line + ')']); return false; };
        window.addEventListener('unhandledrejection', function(e) { addLog('error', ['❌ Promise rejected: ' + (e.reason || e)]); });
        console.log('📱 App initialized. Logging active.');
      }

      // ================= INTERNAL LOGIC =================
      window.createDefaultList = function() { 
        var id = String(appData.nextListId++); 
        appData.lists[id] = { id, name: 'My Words', words: [], settings: { wordTime: 4, transTime: 4, batchSize: 100 }, batch: [], nextWordId: 1 }; 
        appData.currentListId = id; window.saveData(); 
      };

      window.loadCurrentList = function() { 
        var list = appData.lists[appData.currentListId]; if (!list) return; 
        words = list.words || []; settings = list.settings || { wordTime: 4, transTime: 4, batchSize: 100 }; currentBatchIds = list.batch || []; 
        $('set-word-time').value = settings.wordTime; $('set-trans-time').value = settings.transTime; $('set-batch-size').value = settings.batchSize; 
        words.forEach(function(w) { w.id = String(w.id); if (w.status !== STATUS_REVISION) w.status = STATUS_POSTPONED; w.lastRevision = w.lastRevision || ''; }); 
      };

      window.saveCurrentList = function() { var list = appData.lists[appData.currentListId]; if (!list) return; list.words = words; list.settings = settings; list.batch = currentBatchIds; window.saveData(); };
      window.saveData = function() { 
        if (!storageAvailable) return;
        try { localStorage.setItem(KEY_DATA, JSON.stringify(appData)); } 
        catch(e) { console.error('Save failed:', e); window.toast('❗ Save failed'); }
      };

      window.syncBatchStatuses = function() { 
        var batchSet = new Set(currentBatchIds.map(String)); 
        var changed = false; 
        words.forEach(function(w) { 
          if (batchSet.has(String(w.id))) { if (w.status !== STATUS_NEW) { w.status = STATUS_NEW; changed = true; } }
          else if (w.status === STATUS_NEW) { w.status = STATUS_POSTPONED; changed = true; }
        }); 
        if (changed) window.saveCurrentList(); 
      };

      window.startSession = function() { 
        if (sessionRecursionGuard) return;
        sessionRecursionGuard = true;
        try {
          console.log('Starting session. Mode:', mode, 'Batch:', currentBatchIds.length, 'Size:', settings.batchSize);
          paused = false; phase = 'idle'; window.clearTimer(); queueIndex = 0; window.updatePauseBtn();
          if (mode === 'learning') { 
            window.syncBatchStatuses(); 
            var allNew = words.filter(function(w) { return w.status === STATUS_NEW; }); 
            currentBatchIds = currentBatchIds.filter(function(id) { return allNew.some(function(w) { return w.id === id; }); }); 
            if (currentBatchIds.length > settings.batchSize) {
              currentBatchIds = currentBatchIds.slice(0, settings.batchSize);
              window.saveCurrentList(); window.syncBatchStatuses();
            } else if (currentBatchIds.length < settings.batchSize) {
              var candidates = words.filter(function(w) { return w.status === STATUS_POSTPONED && currentBatchIds.indexOf(w.id) === -1; }); 
              var shuffled = window.shuffleArray(candidates); 
              var needed = settings.batchSize - currentBatchIds.length;
              if (needed > 0 && shuffled.length > 0) { currentBatchIds.push.apply(currentBatchIds, shuffled.slice(0, needed).map(function(w) { return w.id; })); window.saveCurrentList(); window.syncBatchStatuses(); }
            }
            if (currentBatchIds.length === 0) { window.showEmptyCard('No POSTPONED words. Add/import more.'); return; } 
            queue = window.shuffleArray(currentBatchIds); 
          } else { 
            var revIds = words.filter(function(w) { return w.status === STATUS_REVISION; }).map(function(w) { return w.id; }); 
            if (revIds.length === 0) { window.showEmptyCard('Master words first'); return; } 
            queue = window.shuffleArray(revIds); 
          } 
          window.updateBadge(); window.showCurrentCard(); 
        } finally { sessionRecursionGuard = false; }
      };

      window.showCurrentCard = function() { 
        while (queueIndex < queue.length) { 
          var id = queue[queueIndex]; var item = words.find(function(w) { return w.id === String(id); }); 
          if (item) { window.displayWord(item); return; } queue.splice(queueIndex, 1); 
        } 
        if (queue.length === 0) window.startSession(); 
      };

      window.displayWord = function(item) { 
        phase = 'word'; item.lastRevision = new Date().toISOString(); 
        elWord.textContent = item.word; elPron.textContent = item.pronunciation || ''; elTrans.textContent = item.translation; elTrans.classList.remove('visible'); 
        elCounter.textContent = 'Seen: ' + (item.counter || 0) + '×'; elRevision.textContent = 'Last: ' + (item.lastRevision ? new Date(item.lastRevision).toLocaleString() : 'Never'); 
        item.counter = (item.counter || 0) + 1; window.saveCurrentList(); window.updateBadge(); 
        window.startPhase(settings.wordTime * 1000, window.showTranslation); 
      };

      window.showTranslation = function() { phase = 'trans'; elTrans.classList.add('visible'); window.startPhase(settings.transTime * 1000, window.advance); };
      window.advance = function() { queueIndex++; if (queueIndex >= queue.length) window.startSession(); else window.showCurrentCard(); };
      window.startPhase = function(ms, cb) { phaseStart = Date.now(); phaseDuration = ms; timerId = setTimeout(function() { if (!paused) cb(); }, ms); };
      window.clearTimer = function() { clearTimeout(timerId); timerId = null; };
      window.updateBadge = function() { if (elBadge) elBadge.textContent = mode === 'learning' ? queue.length + '/' + currentBatchIds.length : queue.length; };
      
      window.showEmptyCard = function(msg) { 
        if(!elWord) return; 
        elWord.textContent = '📭'; if(elPron) elPron.textContent = ''; 
        if(elTrans) { elTrans.textContent = msg; elTrans.classList.remove('visible'); } 
        if(elCounter) elCounter.textContent = ''; if(elRevision) elRevision.textContent = 'Last: Never'; 
        if(elBadge) elBadge.textContent = '0'; if(elStatus) elStatus.textContent = ''; 
      };

      window.renderListSelector = function() { var sel = $('list-select'); sel.innerHTML = ''; Object.keys(appData.lists).forEach(function(id) { var list = appData.lists[id]; var opt = document.createElement('option'); opt.value = list.id; opt.textContent = list.name; if (list.id === appData.currentListId) opt.selected = true; sel.appendChild(opt); }); };

      // ================= UTILS =================
      window.clamp = function(a,b,v){return Math.min(b,Math.max(a,v||a))};
      window.escHtml = function(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML};
      window.shuffleArray = function(arr){var a=[...arr];for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a};
      window.toast = function(m){ if(elStatus) { elStatus.textContent = m; setTimeout(function(){if(elStatus.textContent===m) elStatus.textContent=''},2000); } };

      // ================= INIT =================
      window.loadAll = function() {
        console.log('Loading app...');
        try {
          var d = JSON.parse(localStorage.getItem(KEY_DATA));
          if (d) appData = d;
          console.log('Loaded data for', Object.keys(appData.lists).length, 'list(s)');
        } catch(e) { console.error('Load failed:', e); }
        if (!appData.currentListId || !appData.lists[appData.currentListId]) window.createDefaultList();
        window.loadCurrentList(); window.renderListSelector(); window.syncBatchStatuses(); window.startSession();
      };

      function initApp() {
        try { localStorage.setItem('__test__', '1'); localStorage.removeItem('__test__'); } catch(e) { storageAvailable = false; console.warn('⚠️ localStorage disabled.'); }
        
        $ = function(id) { return document.getElementById(id); };
        elCard = $('main-card'); elWord = $('c-word'); elPron = $('c-pron'); elTrans = $('c-trans');
        elCounter = $('c-counter'); elRevision = $('c-revision'); elBadge = $('q-badge'); elStatus = $('status'); elPauseBtn = $('pause-btn');
        
        if (!elCard) { console.error('CRITICAL: #main-card not found'); return; }
        
        setupLogging();
        
        // Event Listeners
        try {
          elCard.addEventListener('touchstart', function(e) { e.stopPropagation(); }, {passive: true});
          elCard.addEventListener('click', function(e) { 
            if (queue.length === 0) return; var sel = window.getSelection(); 
            if (sel && sel.type === 'Range' && sel.toString().trim().length > 0) return; 
            var item = words.find(function(w) { return w.id === queue[queueIndex]; }); if (!item) return; 
            if (mode === 'learning') { item.status = STATUS_REVISION; currentBatchIds = currentBatchIds.filter(function(id) { return id !== item.id; }); window.saveCurrentList(); window.syncBatchStatuses(); window.toast('✅ Learned'); } 
            else { item.status = STATUS_POSTPONED; window.saveCurrentList(); window.syncBatchStatuses(); window.toast('🔄 Postponed'); } 
            window.clearTimer(); window.advance(); 
          });
        } catch(err) { console.error('Card listener failed:', err); }

        document.querySelectorAll('[data-mode]').forEach(function(btn) { btn.addEventListener('click', function() { if (btn.dataset.mode === mode) return; mode = btn.dataset.mode; document.querySelectorAll('[data-mode]').forEach(function(b) { b.classList.toggle('active', b.dataset.mode === mode); }); window.startSession(); }); });
        
        $('edit-modal').addEventListener('click', function(e) { if(e.target===$('edit-modal')) window.closeModal(); });
        $('settings-modal').addEventListener('click', function(e) { if(e.target===$('settings-modal')) window.toggleSettings(); });
        
        window.loadAll();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp);
      } else {
        initApp();
      }
    })();
  </script>
</body>
</html>
