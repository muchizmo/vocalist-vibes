<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Word Learning - SRS</title>
  <style>
    :root {
      --bg: #0b1220; --card: #151f32; --text: #e2e8f0; --muted: #94a3b8;
      --primary: #3b82f6; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --purple: #a855f7; --pink: #db2777;
      --border: #1e293b; --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 1rem; }
    
    header { width: 100%; max-width: 420px; margin-bottom: 1rem; text-align: center; }
    h1 { font-size: 1.2rem; color: var(--muted); margin-bottom: 0.3rem; }
    .version { font-size: 0.7rem; color: var(--muted); opacity: 0.7; margin-bottom: 0.5rem; display: inline-block; background: var(--card); padding: 0.2rem 0.5rem; border-radius: 4px; border: 1px solid var(--border); }
    
    .list-selector { display: flex; gap: 0.3rem; align-items: center; justify-content: center; margin-bottom: 0.8rem; flex-wrap: wrap; }
    .list-selector select { padding: 0.4rem; background: var(--card); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.85rem; min-width: 120px; }
    .list-selector .btn { padding: 0.4rem 0.6rem; font-size: 0.8rem; }
    
    .nav-row { display: flex; gap: 0.3rem; background: var(--card); padding: 3px; border-radius: 8px; border: 1px solid var(--border); flex-wrap: wrap; }
    .nav-btn { flex: 1; min-width: 50px; padding: 0.4rem; border: none; background: transparent; color: var(--muted); font-weight: 500; cursor: pointer; border-radius: 6px; transition: 0.2s; font-size: 0.8rem; }
    .nav-btn.active { background: var(--primary); color: #fff; }
    .nav-btn:hover { background: var(--border); }
    .nav-btn.active:hover { background: var(--primary); }
    .nav-btn.log-btn { color: var(--warning); }
    .nav-btn.log-btn.active { background: var(--warning); color: #000; }
    .nav-btn.repeat-active { background: var(--pink) !important; color: #fff !important; box-shadow: 0 0 8px rgba(219, 39, 119, 0.5); }

    #card-view { width: 100%; max-width: 420px; margin: 0 auto; display: block; }
    .card-section { width: 100%; display: flex; flex-direction: column; align-items: center; margin: 0 auto 1.5rem; }
    .card-wrap { width: 100%; margin-bottom: 1rem; }
    
    .flashcard { 
      width: 100%; min-height: 280px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); 
      padding: 1.5rem; text-align: center; cursor: pointer; user-select: text;
      position: relative; overflow: hidden; touch-action: manipulation;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    .flashcard:active { transform: scale(0.98); }
    .flashcard .word { 
      font-size: 2rem; font-weight: 400; margin-bottom: 0.3rem; min-height: 3rem; line-height: 1.2; user-select: text;
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
      -webkit-font-smoothing: antialiased; word-break: break-word; overflow-wrap: break-word;
    }
    .flashcard .pron { 
      font-size: 1rem; color: var(--primary); font-weight: 500; margin-bottom: 0.5rem; min-height: 1.5rem; 
      font-family: ui-monospace, monospace; word-break: break-word; overflow-wrap: break-word;
    }
    .flashcard .trans { 
      font-size: 1.2rem; color: var(--muted); font-weight: 400; opacity: 0; transform: translateY(6px); transition: opacity 0.3s ease, transform 0.3s ease; 
      min-height: 2.5rem; user-select: text; word-break: break-word; overflow-wrap: break-word;
    }
    .flashcard .trans.visible { opacity: 1; transform: translateY(0); }
    .flashcard .badge { position: absolute; top: 0.6rem; right: 0.6rem; font-size: 0.7rem; background: var(--bg); color: var(--muted); padding: 0.2rem 0.5rem; border-radius: 4px; border: 1px solid var(--border); }
    .flashcard .hint { font-size: 0.75rem; color: var(--muted); opacity: 0.7; margin-top: 0.5rem; }
    .flashcard .meta-row { font-size: 0.7rem; color: var(--muted); margin-top: 0.5rem; display: flex; justify-content: center; gap: 0.8rem; flex-wrap: wrap; }

    .controls { width: 100%; display: flex; gap: 0.3rem; justify-content: center; margin-bottom: 0.8rem; }
    .btn { padding: 0.4rem 0.8rem; border: none; border-radius: 6px; font-weight: 500; cursor: pointer; transition: 0.15s; background: var(--primary); color: #fff; user-select: none; font-size: 0.85rem; }
    .btn:active { opacity: 0.9; }
    .btn.secondary { background: var(--card); border: 1px solid var(--border); color: var(--text); }
    .btn.danger { background: var(--danger); }
    .btn.success { background: var(--success); }
    
    .status-msg { text-align: center; min-height: 1.2rem; color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem; }

    .filter-row { display: flex; gap: 0.3rem; margin-bottom: 0.6rem; flex-wrap: wrap; }
    .filter-btn { padding: 0.3rem 0.6rem; font-size: 0.8rem; background: var(--card); border: 1px solid var(--border); color: var(--muted); border-radius: 4px; cursor: pointer; }
    .filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    
    .list-view { width: 100%; max-width: 560px; display: none; }
    .list-view.active { display: block; }
    
    .view-header { display: flex; justify-content: center; margin-bottom: 0.6rem; }
    .view-header h3 { 
        cursor: pointer; color: var(--muted); font-size: 1rem; padding: 0.5rem 1rem; 
        border-bottom: 2px solid transparent; transition: 0.2s;
    }
    .view-header h3:hover { color: var(--primary); border-color: var(--primary); }
    
    .word-list { display: grid; gap: 0.4rem; max-height: 50vh; overflow-y: auto; padding-right: 0.3rem; }
    .word-item { display: flex; align-items: flex-start; gap: 0.6rem; background: var(--card); padding: 0.6rem; border-radius: 8px; border: 1px solid var(--border); }
    .word-item .info { flex: 1; min-width: 0; }
    .word-item .w { font-weight: 500; font-size: 0.95rem; word-break: break-word; }
    .word-item .p { font-size: 0.8rem; color: var(--primary); font-family: ui-monospace, monospace; margin: 0.05rem 0; }
    .word-item .t { color: var(--muted); font-size: 0.8rem; margin-top: 0.05rem; white-space: normal; word-break: break-word; line-height: 1.2; }
    .word-item .meta { font-size: 0.7rem; color: var(--muted); margin-top: 0.15rem; }
    .word-item .status-tag { font-size: 0.65rem; padding: 0.15rem 0.4rem; border-radius: 3px; font-weight: 600; }
    .status-tag.new { background: rgba(59,130,246,0.2); color: var(--primary); }
    .status-tag.postponed { background: rgba(168,85,247,0.2); color: var(--purple); }
    .status-tag.learned { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }
    .status-tag.revision { background: rgba(219, 39, 119, 0.2); color: var(--pink); }
    .word-item .actions { display: flex; gap: 0.3rem; flex-shrink: 0; align-self: center; }
    .word-item .actions button { padding: 0.25rem 0.5rem; font-size: 0.8rem; }

    details.add-section { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); margin-top: 0.8rem; }
    summary.add-summary { cursor: pointer; padding: 0.8rem; font-size: 0.95rem; color: var(--muted); list-style: none; display: flex; justify-content: center; }
    summary.add-summary::after { content: '+'; margin-left: 0.5rem; font-weight: bold; }
    details.add-section[open] summary.add-summary::after { content: '-'; }
    .add-content { padding: 0 1rem 1rem; }
    .input-group { display: flex; gap: 0.4rem; margin-bottom: 0.6rem; flex-wrap: wrap; }
    .input-group input { flex: 1; min-width: 100px; padding: 0.5rem; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.9rem; }

    .log-container { 
      background: #0a0f18; border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem; 
      height: 55vh; overflow-y: auto; font-family: ui-monospace, monospace; font-size: 0.75rem; 
      white-space: pre-wrap; word-break: break-all; line-height: 1.4;
    }
    .log-entry { margin-bottom: 0.25rem; border-bottom: 1px solid #1e293b; padding-bottom: 0.2rem; }
    .log-entry.error { color: #ef4444; }
    .log-entry.warn { color: #f59e0b; }
    .log-entry.info { color: #3b82f6; }
    .log-entry.log { color: #94a3b8; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.2rem; width: 100%; max-width: 400px; max-height: 85vh; overflow-y: auto; }
    .modal h3 { margin-bottom: 0.8rem; font-size: 1.1rem; }
    .modal input, .modal select, .modal textarea { width: 100%; padding: 0.5rem; margin-bottom: 0.6rem; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.9rem; }
    .modal textarea { min-height: 70px; resize: vertical; font-family: monospace; }
    .modal label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.2rem; }
    .modal-actions { display: flex; gap: 0.4rem; justify-content: flex-end; margin-top: 0.4rem; }

    .settings-content { display: grid; gap: 0.8rem; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; }
    .row input { width: 50px; padding: 0.3rem; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--text); text-align: center; font-size: 0.9rem; }
    .data-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.4rem; }
    .data-actions .btn { flex: 1; min-width: 90px; justify-content: center; font-size: 0.8rem; }
    
    .quick-import textarea { width: 100%; min-height: 70px; padding: 0.5rem; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: monospace; font-size: 0.85rem; margin-bottom: 0.4rem; }
    .quick-import small { display: block; color: var(--muted); margin-bottom: 0.4rem; font-size: 0.8rem; }
    .quick-import .warn { color: var(--warning); font-size: 0.75rem; display: block; margin-top: 0.2rem; }

    @media (max-width: 480px) { 
      .flashcard .word { font-size: 1.7rem; } 
      .flashcard { padding: 1.5rem 1rem; }
      .input-group { flex-direction: column; }
      .input-group input { width: 100%; }
      .nav-btn { min-width: 45px; padding: 0.35rem; font-size: 0.75rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>📖 Word Learning</h1>
    <div class="version">v1.8.2</div>
    <div class="list-selector">
      <select id="list-select" onchange="window.switchList(this.value)"></select>
      <button class="btn secondary" onclick="window.createNewList()">+ New</button>
      <button class="btn danger" onclick="window.deleteCurrentList()">🗑</button>
    </div>
    <div class="nav-row">
      <button class="nav-btn active" data-mode="learning">📖 Learn</button>
      <button class="nav-btn" data-mode="repeating">🔄 Repeat</button>
      <button class="nav-btn list-btn" onclick="window.showListView()">📋 List</button>
      <button class="nav-btn log-btn" onclick="window.showLogView()">📜 Log</button>
      <button class="nav-btn settings-btn" onclick="window.toggleSettings()">⚙️</button>
    </div>
  </header>

  <main>
    <section id="card-view" class="view-section">
      <div class="card-section">
        <div class="card-wrap">
          <div class="flashcard" id="main-card">
            <div class="badge" id="q-badge">0/0</div>
            <div class="word" id="c-word">---</div>
            <div class="pron" id="c-pron"></div>
            <div class="trans" id="c-trans">---</div>
            <div class="meta-row">
              <span id="c-level">Lvl: 0</span>
              <span id="c-counter">Seen: 0×</span>
              <span id="c-revision">Last: Never</span>
            </div>
            <div class="hint">Tap to move · Select text freely</div>
          </div>
        </div>
        <div class="controls">
          <button class="btn secondary" onclick="window.prevCard()">⏮</button>
          <button class="btn secondary" id="pause-btn" onclick="window.togglePause()">⏸</button>
          <button class="btn secondary" onclick="window.nextCard()">⏭</button>
        </div>
      </div>
      <div class="status-msg" id="status">Add words to begin</div>
    </section>

    <section id="list-view" class="view-section list-view">
      <div class="view-header">
        <h3 onclick="window.showCardView()">📚 Library</h3>
      </div>
      <div class="filter-row">
        <button class="filter-btn active" data-filter="all" onclick="window.setFilter('all')">All</button>
        <button class="filter-btn" data-filter="new" onclick="window.setFilter('new')">📖 New</button>
        <button class="filter-btn" data-filter="postponed" onclick="window.setFilter('postponed')">📥 Postponed</button>
        <button class="filter-btn" data-filter="learned" onclick="window.setFilter('learned')">🟡 Learned</button>
        <button class="filter-btn" data-filter="revision" onclick="window.setFilter('revision')">🔄 Revision</button>
      </div>
      <div class="word-list" id="word-list"></div>
      <div id="empty-list" style="text-align:center; padding:1.5rem; color:var(--muted); display:none; font-size:0.9rem;">No words yet.</div>
    </section>

    <section id="log-view" class="view-section list-view">
      <div class="view-header">
        <h3 onclick="window.showCardView()">📜 App Log</h3>
      </div>
      <div id="log-container" class="log-container"></div>
      <button class="btn secondary" onclick="window.clearLog()" style="margin-top:0.5rem; width:100%;">🗑 Clear Log</button>
    </section>

    <details class="add-section">
      <summary class="add-summary">➕ Add Word</summary>
      <div class="add-content">
        <div class="input-group">
          <input type="text" id="input-word" placeholder="Word">
          <input type="text" id="input-pron" placeholder="Pronunciation">
          <input type="text" id="input-trans" placeholder="Translation">
        </div>
        <button class="btn success" onclick="window.addWord()" style="width:100%">Add</button>
      </div>
    </details>
  </main>

  <!-- SETTINGS MODAL -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal">
      <h3>⚙️ Settings</h3>
      <div class="settings-content">
        <div class="row">
          <label>Word time</label>
          <input type="number" id="set-word-time" min="1" max="60" value="4"> <span>sec</span>
        </div>
        <div class="row">
          <label>Trans time</label>
          <input type="number" id="set-trans-time" min="1" max="60" value="4"> <span>sec</span>
        </div>
        <div class="row">
          <label>Batch size</label>
          <input type="number" id="set-batch-size" min="1" max="1000" value="100"> <span>words</span>
        </div>
        <button class="btn secondary" onclick="window.resetBatch()" style="margin-top:0.3rem; width:100%; font-size:0.85rem;">🔄 Reset Batch</button>
        <div class="quick-import">
          <strong>📥 Quick Import</strong>
          <small>Paste: word///translation</small>
          <span class="warn">⚠️ No JSON here.</span>
          <textarea id="quick-import-area" placeholder="apple///яблоко"></textarea>
          <div style="display:flex; gap:0.3rem;">
            <button class="btn success" onclick="window.quickImport()">Import</button>
            <button class="btn secondary" onclick="document.getElementById('quick-import-area').value=''">Clear</button>
          </div>
        </div>
        <hr style="border:none; border-top:1px solid var(--border); margin:0.2rem 0;">
        <div class="data-actions">
          <button class="btn secondary" onclick="window.exportData()">📤 Export</button>
          <input type="file" id="import-file" accept=".json" style="display:none" onchange="window.importJSON(this)">
          <button class="btn secondary" onclick="document.getElementById('import-file').click()">📥 Import</button>
          <button class="btn danger" onclick="window.clearAll()">🗑 Clear</button>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="window.applySettings()">Apply</button>
      </div>
    </div>
  </div>

  <!-- EDIT MODAL -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal">
      <h3>✏️ Edit</h3>
      <label>Word</label>
      <input type="text" id="edit-word">
      <label>Pronunciation</label>
      <input type="text" id="edit-pron">
      <label>Translation</label>
      <input type="text" id="edit-trans">
      <label>Status</label>
      <select id="edit-status">
        <option value="new">📖 New</option>
        <option value="postponed">📥 Postponed</option>
        <option value="learned">🟡 Learned</option>
        <option value="revision">🔄 Revision</option>
      </select>
      <label>Level</label>
      <input type="number" id="edit-level" min="0" max="24" style="background:var(--bg); opacity:0.7;">
      <label>Counter</label>
      <input type="number" id="edit-counter" readonly style="background:var(--bg); opacity:0.7;">
      <label>Last seen</label>
      <input type="text" id="edit-revision" readonly style="background:var(--bg); opacity:0.7;">
      <div class="modal-actions">
        <button class="btn secondary" onclick="window.closeModal()">Cancel</button>
        <button class="btn" onclick="window.saveEdit()">Save</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      "use strict";
      var STATUS_NEW = 'new', STATUS_POSTPONED = 'postponed', STATUS_LEARNED = 'learned', STATUS_REVISION = 'revision';
      var KEY_DATA = 'wApp_mobile_v1';
      
      var LEVELS = {
        0:0, 1: 1000*60*1, 2: 1000*60*15, 3: 1000*60*60, 4: 1000*60*60*8, 5: 1*1000*60*60*24,
        6: 2*1000*60*60*24, 7: 2*1000*60*60*24, 8: 5*1000*60*60*24, 9: 5*1000*60*60*24, 10: 7*1000*60*60*24,
        11: 7*1000*60*60*24, 12: 20*1000*60*60*24, 13: 20*1000*60*60*24, 14: 50*1000*60*60*24, 15: 50*1000*60*60*24,
        16: 100*1000*60*60*24, 17: 100*1000*60*60*24, 18: 200*1000*60*60*24, 19: 200*1000*60*60*24, 20: 400*1000*60*60*24,
        21: 400*1000*60*60*24, 22: 800*1000*60*60*24, 23: 800*1000*60*60*24, 24: 1600*1000*60*60*24
      };

      var TEST_WORDS = [
        { word: "Hello", translation: "Привет", pronunciation: "[həˈloʊ]" },
        { word: "World", translation: "Мир", pronunciation: "[wɜːrld]" },
        { word: "Apple", translation: "Яблоко", pronunciation: "[ˈæpəl]" },
        { word: "Book", translation: "Книга", pronunciation: "[bʊk]" },
        { word: "Water", translation: "Вода", pronunciation: "[ˈwɔːtər]" },
        { word: "Sun", translation: "Солнце", pronunciation: "[sʌn]" },
        { word: "Moon", translation: "Луна", pronunciation: "[muːn]" },
        { word: "Friend", translation: "Друг", pronunciation: "[frɛnd]" },
        { word: "Time", translation: "Время", pronunciation: "[taɪm]" },
        { word: "Love", translation: "Любовь", pronunciation: "[lʌv]" }
      ];

      var appData = { lists: {}, currentListId: null, nextListId: 1 };
      var words = [], settings = { wordTime: 4, transTime: 4, batchSize: 100 }, mode = 'learning', currentFilter = 'all';
      var currentBatchIds = [], queue = [], queueIndex = 0;
      var paused = false, phase = 'idle', phaseStart = 0, phaseDuration = 0, timerId = null, editingId = null;
      var sessionRecursionGuard = false;
      var storageAvailable = true;
      var logEntries = [];
      var srsTimerId = null;
      
      var $, elCard, elWord, elPron, elTrans, elCounter, elRevision, elLevel, elBadge, elStatus, elPauseBtn, logContainer, repeatBtn;

      // ================= LOGGING SYSTEM =================
      var logBuffer = [];
      function initLogSystem() {
        logContainer = $('log-container');
        if (logContainer && logBuffer.length > 0) {
           logBuffer.forEach(function(log) { appendLogToUI(log.type, log.msg); });
           logBuffer = [];
        }
      }
      function appendLogToUI(type, msg) {
         if (!logContainer) return;
         var entry = document.createElement('div');
         entry.className = 'log-entry ' + (type === 'error' ? 'error' : type === 'warn' ? 'warn' : type === 'info' ? 'info' : 'log');
         entry.textContent = msg;
         logContainer.appendChild(entry);
         logContainer.scrollTop = logContainer.scrollHeight;
      }
      function addLog(type, args) {
          var time = new Date().toLocaleTimeString();
          var msg = Array.prototype.map.call(args, function(a) {
            try { return (typeof a === 'object' && a !== null) ? JSON.stringify(a).substring(0, 150) : String(a); } catch(e) { return String(a); }
          }).join(' ');
          var fullMsg = `[${time}] ${msg}`;
          logEntries.push({ time, type, msg });
          if (logEntries.length > 600) logEntries.shift();
          if (logContainer) appendLogToUI(type, fullMsg);
          else { logBuffer.push({type, msg: fullMsg}); if (logBuffer.length > 100) logBuffer.shift(); }
      }
      var oLog = console.log, oErr = console.error, oWarn = console.warn;
      console.log = function() { addLog('log', arguments); oLog.apply(console, arguments); };
      console.error = function() { addLog('error', arguments); oErr.apply(console, arguments); };
      console.warn = function() { addLog('warn', arguments); oWarn.apply(console, arguments); };
      window.onerror = function(msg, url, line, col, err) { addLog('error', ['❌ Error: ' + msg + ' (L:' + line + ')']); return false; };
      window.addEventListener('unhandledrejection', function(e) { addLog('error', ['❌ Promise rejected: ' + (e.reason || e)]); });
      console.log('📱 App initialized. Logging active.');

      // ================= GLOBAL FUNCTIONS =================
      window.updatePauseBtn = function() { if (elPauseBtn) elPauseBtn.textContent = paused ? '▶' : '⏸'; };
      window.closeModal = function() { if ($) $('edit-modal').classList.remove('active'); editingId = null; };
      window.clearLog = function() { 
         if (!logContainer) return; 
         logContainer.innerHTML = ''; logEntries = []; 
         console.log('🗑 Log cleared'); 
      };

      // ================= VIEW MANAGEMENT (FIXED & ROBUST) =================
      function hideAllViews() {

      window.quickImport = function() { 
        var raw = $('quick-import-area').value.trim(); if (!raw) return window.toast('❌ Paste word///translation'); 
        var parts = raw.split('///').map(function(s) { return s.trim(); }).filter(Boolean);

      window.importJSON = function(inp) {

        r.onload = function(e) { 
          try { 
            var d = JSON.parse(e.target.result);

            var c=0, list = appData.lists[appData.currentListId]; 
            d.forEach(function(it) { 
              var w = String(it.word || '').trim(), t = String(it.translation || '').trim(), p = it.pronunciation || '';

              if (!w || !t || words.some(function(x){return x.word.toLowerCase()===w.toLowerCase();})) return; 
              words.push({id:String(list.nextWordId++), word:w, pronunciation:p, translation:t, status:st, counter:it.counter||0, level:it.level||0, lastRevision: it.lastRevision || Date.now(), revisionViewsCount: 0, flipSide: false}); c++; 
            }); 
            if(c){ window.saveCurrentList(); window.recalculateSRS(); window.startSession(); if($('list-view').classList.contains('active')) window.renderWordList(); window.toast('✅ '+c); } 
            else window.toast('⚠️ None');

        };

      window.exportData = function() {

      function getTimeRemaining(w) {
        if (!w.lastRevision || w.status === STATUS_REVISION || w.status === STATUS_NEW || w.status === STATUS_POSTPONED) return '';
        var lvl = w.level || 0, delay = LEVELS[lvl];
        if (!delay) return '';
        var nextDue = parseInt(w.lastRevision) + delay, diff = nextDue - Date.now();
        if (diff <= 0) return "⏰ Now";
        var mins = Math.floor(diff / 60000);
        if (mins < 60) return "⏰ " + mins + "m";
        var hours = Math.floor(mins / 60);
        if (hours < 24) return "⏰ " + hours + "h";
        var days = Math.floor(hours / 24);
        if (days < 30) return "⏰ " + days + "d";
        return "⏰ " + Math.floor(days / 30) + "mo";
      }

      window.renderWordList = function() { 
        if (!words || !words.length) { $('empty-list').style.display = 'block'; return; }
        window.recalculateSRS(); var c = $('word-list'); c.innerHTML = ''; 
        var f = currentFilter === 'all' ? words : words.filter(function(w) { return w.status === currentFilter; }); 
        if (!f.length) { $('empty-list').style.display = 'block'; return; } $('empty-list').style.display = 'none'; 
        f.forEach(function(w) { 
          var el = document.createElement('div'); el.className = 'word-item'; 
          var ph = w.pronunciation ? '<div class="p">' + window.escHtml(w.pronunciation) + '</div>' : ''; 
          var metaText = '👁 ' + (w.counter || 0) + ' | Lvl ' + (w.level||0);
          var nextRev = getTimeRemaining(w); if (nextRev) metaText += ' | ' + nextRev;
          el.innerHTML = '<div class="info"><div class="w">' + window.escHtml(w.word) + '</div>' + ph + '<div class="t">' + window.escHtml(w.translation) + '</div><div class="meta">' + metaText + '</div></div><span class="status-tag ' + w.status + '">' + w.status + '</span><div class="actions"><button class="btn secondary" onclick="window.openEdit(\'' + w.id + '\')">✏️</button><button class="btn danger" onclick="window.deleteWord(\'' + w.id + '\')">🗑</button></div>'; 
          c.appendChild(el); 
        }); 
      };

      window.openEdit = function(id) { 
        editingId = id; var w = words.find(function(x) { return x.id === id; }); if (!w) return; 
        $('edit-word').value = w.word || ''; $('edit-pron').value = w.pronunciation || ''; $('edit-trans').value = w.translation || ''; 
        $('edit-status').value = w.status || STATUS_POSTPONED; $('edit-level').value = w.level || 0; $('edit-counter').value = w.counter || 0; 
        $('edit-revision').value = w.lastRevision ? new Date(w.lastRevision).toLocaleString() : 'Never'; $('edit-modal').classList.add('active'); 
      };
      window.saveEdit = function() { 
        var w = words.find(function(x) { return x.id === editingId; }); if (!w) return window.closeModal(); 
        w.word = $('edit-word').value.trim() || w.word; w.pronunciation = $('edit-pron').value.trim(); w.translation = $('edit-trans').value.trim() || w.translation; 
        var ns = $('edit-status').value; 
        if (ns !== w.status) { 
           w.status = ns; 
           if (ns === STATUS_NEW || ns === STATUS_POSTPONED) w.level = 0; 
        }
        window.saveCurrentList(); window.recalculateSRS(); window.closeModal(); window.renderWordList(); window.startSession(); window.toast('✅ Saved'); 
      };
      window.deleteWord = function(id) { 
        words = words.filter(function(w) { return w.id !== id; }); currentBatchIds = currentBatchIds.filter(function(b) { return b !== id; }); 
        window.saveCurrentList(); window.recalculateSRS(); window.renderWordList(); window.startSession(); window.toast('🗑 Deleted'); 
      };

      function isDueForReview(w) {
        if (!w.lastRevision) return true;
        var lvl = Math.max(0, Math.min(24, parseInt(w.level) || 0));
        return (Date.now() - parseInt(w.lastRevision)) >= LEVELS[lvl];
      }

      window.recalculateSRS = function() {
        var changed = false;
        words.forEach(function(w) {
          if (w.status === STATUS_REVISION || w.status === STATUS_LEARNED) {
            if (isDueForReview(w)) {
              if (w.status !== STATUS_REVISION) { w.status = STATUS_REVISION; changed = true; w.revisionViewsCount = 0; w.flipSide = false; }
            } else { if (w.status !== STATUS_LEARNED) { w.status = STATUS_LEARNED; changed = true; } }
          }
        });
        if (changed) window.saveCurrentList();
        if (repeatBtn) repeatBtn.classList.toggle('repeat-active', words.some(function(w) { return w.status === STATUS_REVISION; }));
      };

      function createDefaultList() { 
        var id = String(appData.nextListId++); 
        var defaultWords = TEST_WORDS.map(function(t, i) {
           return { id: String(i+1), word: t.word, pronunciation: t.pronunciation, translation: t.translation, status: STATUS_POSTPONED, counter: 0, level: 0, lastRevision: Date.now(), revisionViewsCount: 0, flipSide: false };
        });
        appData.lists[id] = { id: id, name: 'Default Test List', words: defaultWords, settings: { wordTime: 4, transTime: 4, batchSize: 100 }, batch: [], nextWordId: 11 };

      window.loadCurrentList = function() { 
        var list = appData.lists[appData.currentListId]; 
        if (!list) { console.error('❌ Cannot load list:', appData.currentListId); return; }
        words = list.words || []; 
        settings = list.settings || { wordTime: 4, transTime: 4, batchSize: 100 }; 
        currentBatchIds = (list.batch || []).map(String); 
        $('set-word-time').value = settings.wordTime; $('set-trans-time').value = settings.transTime; $('set-batch-size').value = settings.batchSize; 
        console.log(`💾 Loaded list: "${list.name}" | ${words.length} words | Batch: ${currentBatchIds.length}`);
        
        words.forEach(function(w) { 
          w.id = String(w.id); 
          if ([STATUS_NEW, STATUS_POSTPONED, STATUS_LEARNED, STATUS_REVISION].indexOf(w.status) === -1) w.status = STATUS_POSTPONED;
          w.level = parseInt(w.level) || 0; w.lastRevision = w.lastRevision || Date.now(); 
          w.revisionViewsCount = parseInt(w.revisionViewsCount) || 0; w.flipSide = !!w.flipSide;
        }); 
      };

      window.renderListSelector = function() {

        Object.keys(appData.lists).forEach(function(id) { 
           var list = appData.lists[id]; var opt = document.createElement('option');

      window.saveCurrentList = function() {

      window.saveData = function() { 
        if (!storageAvailable) return;
        try { localStorage.setItem(KEY_DATA, JSON.stringify(appData)); } catch(e) { console.error('❌ Save failed:', e); window.toast('❗ Save failed'); }
      };

      // NEW BATCH LOGIC: Strict Priority without Demotion
      window.syncBatchStatuses = function() { 
        var now = Date.now();
        var newWords = words.filter(function(w) { return w.status === STATUS_NEW; });
        newWords.sort(function(a, b) { return (a.lastRevision || 0) - (b.lastRevision || 0); });
        
        var postponedWords = words.filter(function(w) { return w.status === STATUS_POSTPONED; });
        postponedWords.sort(function(a, b) { return (a.lastRevision || 0) - (b.lastRevision || 0); });

        var newBatchIds = [];
        var currentCount = 0;
        var newSelected = 0, postponedSelected = 0;

        // Priority 1: Fill with NEW words (up to batchSize)
        for (var i = 0; i < newWords.length; i++) {
           if (currentCount >= settings.batchSize) break;
           newBatchIds.push(String(newWords[i].id));
           currentCount++;
           newSelected++;
        }

        // Priority 2: Top up with POSTPONED words (Promoting them to NEW)
        if (currentCount < settings.batchSize) {
           for (var j = 0; j < postponedWords.length; j++) {
              if (currentCount >= settings.batchSize) break;
              var w = postponedWords[j];
              w.status = STATUS_NEW;
              newBatchIds.push(String(w.id));
              currentCount++;
              postponedSelected++;
           }
        }

        currentBatchIds = newBatchIds;
        if (newSelected > 0 || postponedSelected > 0) {
           console.log(`✅ Batch Refilled: ${newSelected} New, ${postponedSelected} Postponed (Promoted)`);
           window.saveCurrentList();
        }
      };

      // FIX: Robust Start Session
      window.startSession = function() { 
        if (sessionRecursionGuard) return;
        sessionRecursionGuard = true;
        try {
          console.log(`🚀 Starting session: mode=${mode}, words=${words.length}, batch=${currentBatchIds.length}`);
          showView('card'); 
          window.recalculateSRS(); 
          paused = false; phase = 'idle'; window.clearTimer(); queueIndex = 0; window.updatePauseBtn();
          
          if (mode === 'learning') { 
            if (words.length === 0) { window.showEmptyCard('No words. Add or import words to begin.'); return; }
            window.syncBatchStatuses();

            if (currentBatchIds.length === 0) { 
               var postponed = words.filter(function(w) { return w.status === STATUS_POSTPONED; });
               if (postponed.length > 0) window.showEmptyCard('Batch is empty. Tap "Reset Batch" to rebuild.');
               else window.showEmptyCard('No words available. Add more.');
               return; 
            } 
            queue = window.shuffleArray(currentBatchIds.map(function(id){ return {id: id, flip: false, skip: false}; })); 
          } else { 
            var due = words.filter(function(w) { return w.status === STATUS_REVISION && w.revisionViewsCount < 2; });
            if (due.length === 0) { window.showEmptyCard('✅ All caught up!'); return; } 
            queue = window.shuffleArray(due.map(function(w){ return {id: w.id, flip: w.flipSide, skip: false}; })); 
          } 
          window.updateBadge(); window.showCurrentCard(); 
        } catch(e) {
           console.error('❌ startSession failed:', e);
           window.showEmptyCard('Session error. Check logs.');
        } finally { 
           sessionRecursionGuard = false; 
        }
      };

      window.showCurrentCard = function() { 
        while (queueIndex < queue.length) { 
          var entry = queue[queueIndex]; 
          if (entry.skip) { queueIndex++; continue; }
          var item = words.find(function(w) { return String(w.id) === String(entry.id); }); 
          if (!item) { entry.skip = true; queueIndex++; continue; }
          window.displayWord(item, entry.flip); return;
        } 
        if (queueIndex >= queue.length) window.startSession(); 
      };

      window.displayWord = function(item, isFlipped) { 
        phase = 'word'; var now = Date.now(); 
        item.revisionViewsCount++; item.flipSide = !isFlipped; window.saveCurrentList();
        elPron.textContent = item.pronunciation || ''; 
        elWord.textContent = isFlipped ? item.translation : item.word; 
        elTrans.textContent = isFlipped ? item.word : item.translation;
        elTrans.classList.remove('visible'); 
        elCounter.textContent = 'Seen: ' + (item.counter || 0) + '×'; 
        elRevision.textContent = 'Last: ' + (item.lastRevision ? new Date(item.lastRevision).toLocaleString() : 'Never');
        elLevel.textContent = 'Lvl: ' + (item.level || 0);
        
        // Mark as learned after seeing BOTH sides in revision mode
        if (mode === 'repeating' && item.revisionViewsCount >= 2) {
          item.status = STATUS_LEARNED; item.level = Math.min((item.level || 0) + 1, 24); item.lastRevision = Date.now(); 
          window.saveCurrentList(); window.recalculateSRS(); 
          queue.forEach(function(qE) { if (String(qE.id) === String(item.id)) qE.skip = true; });
        }
        item.counter = (item.counter || 0) + 1; window.updateBadge(); 
        window.startPhase(settings.wordTime * 1000, window.showTranslation); 
      };

      window.showTranslation = function() { 
        phase = 'trans'; 
        if (elPron) { var item = words.find(function(w){return String(w.id)===String(queue[queueIndex]?.id)}); elPron.textContent = item ? (item.pronunciation || '') : ''; }
        elTrans.classList.add('visible'); window.startPhase(settings.transTime * 1000, window.advance); 
      };
      window.advance = function() { queueIndex++; if (queueIndex >= queue.length) window.startSession(); else window.showCurrentCard(); };
      window.startPhase = function(ms, cb) { phaseStart = Date.now(); phaseDuration = ms; timerId = setTimeout(function() { if (!paused) cb(); }, ms); };
      window.clearTimer = function() { clearTimeout(timerId); timerId = null; };
      window.updateBadge = function() { 
        if (!elBadge) return;
        elBadge.textContent = mode === 'learning' ? queue.filter(e => !e.skip).length + ' / ' + currentBatchIds.length : new Set(queue.filter(e=>!e.skip).map(e=>e.id)).size + ' words';
      };
      window.showEmptyCard = function(msg) { 
        if(!elWord) return; elWord.textContent='📭'; if(elPron) elPron.textContent=''; if(elTrans) {elTrans.textContent=msg; elTrans.classList.remove('visible');} 
        if(elCounter) elCounter.textContent=''; if(elRevision) elRevision.textContent='Last: Never'; if(elLevel) elLevel.textContent='Lvl: 0'; if(elBadge) elBadge.textContent='0'; if(elStatus) elStatus.textContent=''; 
      };
      window.clamp = function(a,b,v){return Math.min(b,Math.max(a,v||a))};
      window.escHtml = function(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML};
      window.shuffleArray = function(arr){var a=[...arr];for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a};
      window.toast = function(m){ if(elStatus) { elStatus.textContent = m; setTimeout(function(){if(elStatus.textContent===m) elStatus.textContent=''},2000); } };

      // INIT
      window.loadAll = function() {
        console.log('🔄 Initializing app...');
        try {
          var raw = localStorage.getItem(KEY_DATA);
          var d = raw ? JSON.parse(raw) : null;
          if (d) { appData = d; appData.nextListId = parseInt(appData.nextListId) || 1; }
        } catch(e) { console.error('❌ Load failed:', e); appData = { lists: {}, currentListId: null, nextListId: 1 }; }
        
        if (!appData.currentListId || !appData.lists || !appData.lists[appData.currentListId]) {
          console.log('🆕 Creating default list...');
          window.createDefaultList();
        } else console.log('📋 Active list:', appData.currentListId);
        
        window.renderListSelector();
        window.loadCurrentList();
        window.recalculateSRS();
        window.startSession();
      };

      function initApp() {
        try { localStorage.setItem('__test__', '1'); localStorage.removeItem('__test__'); } catch(e) { storageAvailable = false; }
        $ = function(id) { return document.getElementById(id); };
        elCard = $('main-card'); elWord = $('c-word'); elPron = $('c-pron'); elTrans = $('c-trans');
        elCounter = $('c-counter'); elRevision = $('c-revision'); elLevel = $('c-level'); elBadge = $('q-badge'); elStatus = $('status'); elPauseBtn = $('pause-btn'); repeatBtn = document.querySelector('[data-mode="repeating"]');
        initLogSystem();
        
        elCard.addEventListener('click', function(e) { 
          if (queue.length === 0) return; var sel = window.getSelection(); if (sel && sel.type === 'Range' && sel.toString().trim().length > 0) return; 
          var entry = queue[queueIndex]; if (!entry || entry.skip) return; var item = words.find(function(w) { return String(w.id) === String(entry.id); }); if (!item) return; 
          if (mode === 'learning') { item.status = STATUS_REVISION; item.level = 1; item.lastRevision = Date.now(); item.revisionViewsCount = 0; item.flipSide = false; currentBatchIds = currentBatchIds.filter(function(id) { return String(id) !== String(item.id); }); window.saveCurrentList(); window.recalculateSRS(); window.toast('✅ Moved to Revision'); } 
          else { 
             item.status = STATUS_NEW; 
             item.level = 0; 
             item.lastRevision = Date.now(); 
             item.revisionViewsCount = 0; 
             item.flipSide = false; 
             window.saveCurrentList(); window.recalculateSRS(); window.toast('🔄 Moved to Learn'); 
          } 
          window.clearTimer(); window.advance(); 
        });

        document.querySelectorAll('[data-mode]').forEach(function(btn) { 
           btn.addEventListener('click', function() { if (btn.dataset.mode === mode) return; mode = btn.dataset.mode; document.querySelectorAll('[data-mode]').forEach(function(b) { b.classList.toggle('active', b.dataset.mode === mode); }); window.startSession(); }); 
        });
        $('edit-modal').addEventListener('click', function(e) { if(e.target===$('edit-modal')) window.closeModal(); });
        $('settings-modal').addEventListener('click', function(e) { if(e.target===$('settings-modal')) window.toggleSettings(); });
        srsTimerId = setInterval(window.recalculateSRS, 60000);
        window.loadAll();
      }

      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initApp);
      else initApp();
    })();
  </script>
</body>
</html>
